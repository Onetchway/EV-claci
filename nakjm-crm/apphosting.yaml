# Firebase App Hosting — runtime and build configuration.
#
# App Hosting runs this Next.js app on Cloud Run, so API routes and
# server-rendered pages work as they do locally. Plain Firebase Hosting
# would only serve static files and is not sufficient for this app.
#
# The NEXT_PUBLIC_* values are compiled into the client bundle, so they must
# be available at BUILD time as well as at runtime. They are not secrets —
# access is controlled by the Firestore and Storage rules.
#
# There is no service-account key here. On App Hosting the Admin SDK
# authenticates with the instance's own service account via Application
# Default Credentials, so there is no private key to store or rotate.

runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAV_kfuT6ks8pozX6YGQXHYSCDqtmNte2U
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: nakjmdash.firebaseapp.com
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: nakjmdash
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: nakjmdash.firebasestorage.app
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "981864653831"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:981864653831:web:f0fe8a64a7746ac56436a2"
    availability: [BUILD, RUNTIME]

# If you ever need to run this somewhere without Application Default
# Credentials, store the service-account JSON in Cloud Secret Manager and
# reference it here instead of pasting the key inline:
#
#   - variable: FIREBASE_SERVICE_ACCOUNT_KEY
#     secret: nakjm-crm-service-account
#     availability: [RUNTIME]

# Optional — powers "Auto-fill from PO/WO" on the New Project page. Without
# it that one button is disabled with an explanatory message; nothing else
# is affected. Get a key at console.anthropic.com, store it in Secret
# Manager, then uncomment:
#
#   - variable: ANTHROPIC_API_KEY
#     secret: nakjm-crm-anthropic-key
#     availability: [RUNTIME]
