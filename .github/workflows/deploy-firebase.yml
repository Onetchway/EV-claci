name: Deploy Livanto Green website to Firebase Hosting

on:
  push:
    branches:
      - main
      - claude/ev-charger-crm-build-7ddmrn
    paths:
      - "website/**"
      - ".github/workflows/deploy-firebase.yml"
  workflow_dispatch:

concurrency:
  group: "firebase-hosting-website"
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation — no service-account key needed

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}"

      - name: Deploy to Firebase Hosting (livanto-green-web)
        working-directory: website
        run: npx --yes firebase-tools@latest deploy --only hosting:website --project livanto-278b5 --non-interactive
